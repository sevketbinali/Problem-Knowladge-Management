  frontend-next:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkm_frontend_next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - pkm_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: pkm_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pkm_user
      - POSTGRES_PASSWORD=pkm_password
      - POSTGRES_DB=pkm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkm_user -d pkm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pkm_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: pkm_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pkm_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pkm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pkm_network
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  redis_data:

networks:
  pkm_network:
    driver: bridge
